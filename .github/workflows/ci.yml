name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    # hard ceiling so a hung build/curl cannot hold the runner for the 360-minute default
    timeout-minutes: 20
    env:
      IMAGE: memory-wiki-ci:${{ github.sha }}
      CONTAINER: memory-wiki-ci-${{ github.run_id }}-${{ github.run_attempt }}
      HOST_PORT: "18765"
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Check image contents
        run: |
          # tests stay out of the image; web build (with self-hosted fonts, G-038) and extension are in
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            test ! -e /app/server/test
            test -f /app/web/dist/index.html
            ls /app/web/dist/assets | grep -q "\.woff2$"
            test -f /app/pi-extension/index.ts
            test -f /app/pi-extension/project.ts
          '
      - name: Start container
        run: |
          # data dir must be writable by the image's USER (node); a fresh temp dir is not
          DATA="$RUNNER_TEMP/memory-wiki-data"
          mkdir -p "$DATA" && chmod 0777 "$DATA"
          docker run -d --name "$CONTAINER" -p "127.0.0.1:$HOST_PORT:8765" -v "$DATA:/data" "$IMAGE"
      - name: Wait for /api/health
        run: |
          # deadline-based so per-request time (max 2s each) counts toward the 60s budget
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --connect-timeout 1 --max-time 2 "http://127.0.0.1:$HOST_PORT/api/health"; then echo; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "container exited"; exit 1
            fi
            sleep 1
          done
          echo "health check timed out after 60s"; exit 1
      - name: Check web, install script and data volume
        run: |
          set -eu
          base="http://127.0.0.1:$HOST_PORT"
          out="$RUNNER_TEMP/http"
          mkdir -p "$out"
          get() { code=$(curl -s --connect-timeout 2 --max-time 10 -o "$out/$2" -w '%{http_code}' "$base$1" || true); echo "GET $1 -> $code"; test "$code" = 200; }
          get / index.html
          grep -q '<div id="root"' "$out/index.html"
          get /install.sh install.sh
          grep -q "$base/pi-extension/index.ts" "$out/install.sh"
          get /pi-extension/index.ts ext.ts
          grep -q "$base" "$out/ext.ts"   # placeholder default URL replaced (G-008)
          test -s "$RUNNER_TEMP/memory-wiki-data/memory.db"   # DB lives on the mounted volume
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the install script
        run: |
          # installs into a temp agent dir; serverUrl is merged into an existing settings file
          set -eu
          export PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-agent"
          conf="$PI_CODING_AGENT_DIR/extensions/memory-wiki-all-you-need.json"
          mkdir -p "$(dirname "$conf")"
          echo '{"serverUrl": "http://old.example:1", "timeoutMs": 2500}' > "$conf"
          curl -fsS "http://127.0.0.1:$HOST_PORT/install.sh" | sh
          test -s "$PI_CODING_AGENT_DIR/extensions/memory-wiki-all-you-need/index.ts"
          test -s "$PI_CODING_AGENT_DIR/extensions/memory-wiki-all-you-need/project.ts"
          node -e 'const c = require(process.argv[1]); if (c.serverUrl !== process.argv[2] || c.timeoutMs !== 2500) { console.error(c); process.exit(1); }' "$conf" "http://127.0.0.1:$HOST_PORT"
      - name: Web smoke test (headless Chrome)
        run: |
          # playwright-core stays out of the repo's dependencies: pinned, installed into a temp dir,
          # driving the runner's preinstalled Google Chrome. Seeds data through the API, opens the
          # main routes at 1280/375px in light/dark, fails on console errors, 375px overflow,
          # other-host requests (G-038), native dialogs and a broken delete → undo (G-036).
          npm i --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright-core@1.63.0
          google-chrome --version
          SMOKE_BASE="http://127.0.0.1:$HOST_PORT" \
          SMOKE_PW_DIR="$RUNNER_TEMP/pw" \
          SMOKE_CHROME="$(command -v google-chrome)" \
          SMOKE_OUT="$RUNNER_TEMP/web-smoke" \
            timeout 300 node web/e2e/smoke.mjs
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: ${{ runner.temp }}/web-smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Container logs
        if: failure()
        run: docker logs "$CONTAINER" || true
      - name: Remove container
        if: always()
        run: docker rm -f "$CONTAINER" || true
