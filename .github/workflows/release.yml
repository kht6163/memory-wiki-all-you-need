name: Release image

# Pushing a version tag (v0.8.1) publishes the server image to Docker Hub for
# amd64 and arm64. Needs repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (e.g. v0.8.1)"
        required: true

env:
  IMAGE: docker.io/kht6163/memory-wiki-all-you-need

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Version from tag
        id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # the tag must match the packages, which carry one shared version
          for f in server/package.json web/package.json pi-extension/package.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$version" ]; then echo "$f is $got, tag is $tag"; exit 1; fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=memory-wiki-all-you-need
            org.opencontainers.image.description=Central memory + LLM wiki server for the pi coding agent
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.v.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
